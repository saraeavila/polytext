[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polytext"
version = "0.1.0"
description = "A multilingual NLP model routing and text intelligence API."
readme = "README.md"
requires-python = ">=3.11"

# TODO(V0.6): configure CPU-only PyTorch wheels for Linux Docker builds.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "torch",
    "transformers[sentencepiece]",
    "fasttext-community>=0.11.7,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.setuptools.packages.find]
include = ["app*"]