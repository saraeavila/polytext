[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polytext"
version = "0.1.0"
description = "A multilingual NLP model routing and text intelligence API."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "torch",
    "transformers",
    "sentencepiece",
    "protobuf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.setuptools.packages.find]
include = ["app*"]