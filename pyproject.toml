[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polytext"
version = "0.1.0"
description = "A multilingual NLP model routing and text intelligence API."
readme = "README.md"
requires-python = ">=3.11"

# TODO(V0.6): configure CPU-only PyTorch wheels for Linux Docker builds.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "torch",
    "transformers[sentencepiece]",
    "fasttext-community>=0.11.7,<0.12",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1.18,<2",
    "pydantic[email]",
    "redis>=5,<9",
    "pydantic-settings>=2,<3",
    "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "locust>=2.45,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring real PostgreSQL or Redis infrastructure",
]