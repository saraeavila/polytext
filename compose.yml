services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: polytext
      POSTGRES_USER: polytext
      POSTGRES_PASSWORD: polytext
    ports:
      - "5432:5432"
    volumes:
      - polytext_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polytext -d polytext"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17
    environment:
      POSTGRES_DB: polytext_test
      POSTGRES_USER: polytext
      POSTGRES_PASSWORD: polytext
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polytext -d polytext_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  polytext_postgres_data:
