services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: polytext
      POSTGRES_USER: polytext
      POSTGRES_PASSWORD: polytext
    ports:
      - "5432:5432"
    volumes:
      - polytext_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polytext -d polytext"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17
    profiles:
      - test

    environment:
      POSTGRES_DB: polytext_test
      POSTGRES_USER: polytext
      POSTGRES_PASSWORD: polytext

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U polytext -d polytext_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    profiles:
      - test

    ports:
      - "6380:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .

    ports:
      - "8000:8000"

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: INFO

      DATABASE_URL: >-
        postgresql+psycopg://polytext:polytext@postgres:5432/polytext

      REDIS_URL: redis://redis:6379/0

      FASTTEXT_MODEL_PATH: resources/models/lid.176.ftz

      POLYTEXT_ADMIN_KEY: ${POLYTEXT_ADMIN_KEY}

      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      HF_HOME: /root/.cache/huggingface

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        alembic upgrade head
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000

    volumes:
      - polytext_hf_cache:/root/.cache/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  polytext_postgres_data:
  polytext_hf_cache:
