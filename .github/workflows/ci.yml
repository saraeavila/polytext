name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PolyText
        run: python -m pip install -e ".[dev]"

      - name: Download fastText language model
        run: |
          mkdir -p resources/models
          curl -L \
            https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz \
            -o resources/models/lid.176.ftz

      - name: Run tests
        run: python -m pytest

  integration:
    name: Run integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: polytext_test
          POSTGRES_USER: polytext
          POSTGRES_PASSWORD: polytext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polytext -d polytext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://polytext:polytext@localhost:5432/polytext_test
      TEST_DATABASE_URL: postgresql+psycopg://polytext:polytext@localhost:5432/polytext_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: python -m pytest -m integration -v

  docker:
    name: Build Docker image
    needs:
      - test
      - integration

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t polytext:ci .
